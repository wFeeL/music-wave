name: release
on:
  push:
    tags: ['v*']
permissions: {contents: write}
concurrency:
  group: 'release-${{ github.ref_name }}'
  cancel-in-progress: false
defaults: {run: {shell: bash}}
env:
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
  MODE: full
  # Включает в ci-mac.sh вторую подписанную копию для проверки обновления.
  RELEASE: '1'
jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - id: ci
        # Шаг падает раньше лимита задачи, чтобы публикации результатов хватило времени.
        timeout-minutes: 12
        run: bash scripts/ci-mac.sh "$MODE"
        env: {SIGNING_P12_BASE64: '${{ secrets.SIGNING_P12_BASE64 }}', SIGNING_P12_PASSWORD: '${{ secrets.SIGNING_P12_PASSWORD }}'}
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/WaveFeels-${{ github.ref_name }}*.zip
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
      - if: always()
        run: bash scripts/publish-ci-results.sh
        env: {GH_TOKEN: '${{ github.token }}', CI_OUTCOME: '${{ steps.ci.outcome }}'}
