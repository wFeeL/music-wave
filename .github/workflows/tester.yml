name: tester
# Агент-тестировщик на Linux (ноль минут macOS): читает документ, чек-лист приемки, код и последний
# полный прогон из ci-results, отчет кладет в ci-results. Пока в секретах нет
# CLAUDE_CODE_OAUTH_TOKEN, задача gate выдает ok=false и test не запускается.
on:
  push:
    tags: ['tester-*']
permissions: {contents: write}
concurrency:
  group: 'tester-${{ github.ref_name }}'
  cancel-in-progress: false
defaults: {run: {shell: bash}}
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      ok: ${{ steps.check.outputs.ok }}
    steps:
      # В if: секреты недоступны, поэтому проверка идет через env и $GITHUB_OUTPUT.
      - id: check
        env: {TOKEN: '${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}'}
        run: |
          if [[ -n "$TOKEN" ]]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "CLAUDE_CODE_OAUTH_TOKEN is not set, tester skipped"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi
  test:
    needs: gate
    if: needs.gate.outputs.ok == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MODE: tester
    steps:
      # Токен репозитория не остается в .git/config: агент читает рабочий каталог.
      - uses: actions/checkout@v5
        with: {persist-credentials: false}
      - id: results
        name: latest full run from ci-results
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          mkdir -p ci-out ci-latest
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c http.extraheader="AUTHORIZATION: basic $auth" fetch --depth 1 origin ci-results
          run=$(git ls-tree --name-only FETCH_HEAD runs/ | grep -E -- '-full-a[0-9]+$' | sort | tail -n 1 || true)
          if [[ -z "$run" ]]; then
            echo "no full run in ci-results" | tee ci-out/tester.log
            exit 1
          fi
          git archive FETCH_HEAD "$run" | tar -x -C ci-latest --strip-components 2
          {
            echo "tested commit: $GITHUB_SHA"
            echo "tag: $GITHUB_REF_NAME"
            echo "full run: $run"
          } > ci-latest/RUN.txt
          cat ci-latest/RUN.txt
      - run: npm i -g @anthropic-ai/claude-code
      - id: tester
        timeout-minutes: 15
        env: {CLAUDE_CODE_OAUTH_TOKEN: '${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}'}
        run: |
          rc=0
          claude -p "$(cat .github/tester-prompt.md)" --max-turns 40 --allowedTools "Read,Glob,Grep,Write" \
            > ci-out/tester.log 2>&1 || rc=$?
          cat ci-out/tester.log
          if [[ $rc -ne 0 ]]; then
            exit "$rc"
          fi
          if [[ ! -s ci-out/tester-report.md ]]; then
            echo "tester did not write ci-out/tester-report.md"
            exit 1
          fi
      - if: always()
        name: summary
        env: {TESTER_OUTCOME: '${{ steps.tester.outcome }}'}
        run: |
          mkdir -p ci-out
          {
            echo "# WaveFeels tester"
            echo
            echo "- result: $TESTER_OUTCOME"
            if [[ -f ci-latest/RUN.txt ]]; then
              sed 's/^/- /' ci-latest/RUN.txt
            fi
            echo "- report: tester-report.md"
          } > ci-out/summary.md
      - if: always()
        run: bash scripts/publish-ci-results.sh
        env: {GH_TOKEN: '${{ github.token }}', CI_OUTCOME: '${{ steps.tester.outcome }}'}
