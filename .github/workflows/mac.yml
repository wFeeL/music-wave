name: mac
on:
  push:
    tags: ['ci-*', 'snap-*', 'full-check-*']
  workflow_dispatch:
    inputs: {mode: {type: choice, options: [fast, snap, full], default: full}}
# Права по умолчанию только на чтение. contents: write получает лишь задача publish.
permissions: {contents: read}
concurrency:
  group: 'mac-${{ github.sha }}-${{ github.ref_name }}'
  cancel-in-progress: false
defaults: {run: {shell: bash}}
env:
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
  MODE: ${{ startsWith(github.ref_name, 'full-check-') && 'full' || startsWith(github.ref_name, 'snap-') && 'snap' || inputs.mode || 'fast' }}
jobs:
  build:
    runs-on: macos-26
    # Сумма лимитов шагов (9 + 1 + 2 + 5) плюс загрузка артефакта.
    timeout-minutes: 19
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with: {persist-credentials: false}
      # Сборка адаптера (чужой код), сборка и тесты идут без секретов и с токеном только на чтение.
      - id: build
        timeout-minutes: 9
        run: bash scripts/ci-mac.sh build "$MODE"
      # Сборка могла изменить файлы в рабочей папке: перед шагом с ключом скрипты берутся из коммита.
      - id: restore
        if: ${{ !cancelled() && env.MODE != 'fast' }}
        timeout-minutes: 1
        run: |
          git -c core.hooksPath=/dev/null checkout --force "$GITHUB_SHA" -- scripts signing Vendor
          git -c core.hooksPath=/dev/null clean -ffdxq -- scripts signing Vendor
      # Единственный шаг с ключом подписи.
      - id: sign
        if: ${{ !cancelled() && env.MODE != 'fast' && steps.restore.outcome == 'success' }}
        timeout-minutes: 2
        run: bash scripts/ci-mac.sh sign "$MODE"
        env: {SIGNING_P12_BASE64: '${{ secrets.SIGNING_P12_BASE64 }}', SIGNING_P12_PASSWORD: '${{ secrets.SIGNING_P12_PASSWORD }}', SIGNING_EXPECTED_LEAF: '${{ vars.SIGNING_EXPECTED_LEAF }}'}
      - id: check
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        run: bash scripts/ci-mac.sh check "$MODE"
      - if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ci-out
          path: ci-out
          if-no-files-found: ignore
          overwrite: true
          retention-days: 7

  publish:
    needs: build
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with: {persist-credentials: false, sparse-checkout: scripts}
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        continue-on-error: true
        with: {name: ci-out, path: ci-out}
      - run: bash scripts/publish-ci-results.sh
        env: {GH_TOKEN: '${{ github.token }}', CI_OUTCOME: '${{ needs.build.result }}'}
