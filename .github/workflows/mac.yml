name: mac
on:
  push:
    tags: ['ci-*', 'snap-*', 'full-check-*']
  workflow_dispatch:
    inputs: {mode: {type: choice, options: [fast, snap, full], default: full}}
permissions: {contents: write}
concurrency:
  group: 'mac-${{ github.sha }}-${{ github.ref_name }}'
  cancel-in-progress: false
defaults: {run: {shell: bash}}
env:
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
  MODE: ${{ startsWith(github.ref_name, 'full-check-') && 'full' || startsWith(github.ref_name, 'snap-') && 'snap' || inputs.mode || 'fast' }}
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - id: ci
        # Шаг падает раньше лимита задачи, чтобы публикации результатов хватило времени.
        timeout-minutes: 12
        run: bash scripts/ci-mac.sh "$MODE"
        env: {SIGNING_P12_BASE64: '${{ secrets.SIGNING_P12_BASE64 }}', SIGNING_P12_PASSWORD: '${{ secrets.SIGNING_P12_PASSWORD }}'}
      - if: always()
        run: bash scripts/publish-ci-results.sh
        env: {GH_TOKEN: '${{ github.token }}', CI_OUTCOME: '${{ steps.ci.outcome }}'}
